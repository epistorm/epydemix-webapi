name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync python scripts/generate_openapi.py
      - run: git diff --exit-code -- web/static/openapi.json
      - run: uv run --no-sync pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --pass-with-no-tests
      - run: bun run build:local
